<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Qeydiyyat - Turbo.az</title>

    <style>
        body {
            background: #f2f2f2;
            font-family: Arial;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: 70px auto;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #e00000;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e00000;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            color: #e00000;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Turbo.az</h1>
    <h2>Qeydiyyat</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Qeydiyyatdan keç</button>
    </form>

    <p>Hesabın var? <a href="{% url 'login' %}">Daxil ol</a></p>

</div>

</body>
</html>
